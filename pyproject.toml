[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "uptick"
version = "0.1.0"
description = "Self-hosted uptime monitoring in one Python package: checks, incidents, and a status page. Standard library only."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "TheRealAlexxx" }]
keywords = ["uptime", "monitoring", "status-page", "self-hosted"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/TheRealAlexxx/uptick"

[project.scripts]
uptick = "uptick.cli:main"

[tool.setuptools.packages.find]
include = ["uptick*"]
